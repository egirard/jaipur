name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux screenshot baselines for review
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}-${{ inputs.update_snapshots || false }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bunx playwright install chromium
      - run: nix develop --command bun run check
      - run: nix develop --command bun run test:unit
      # This fork's AR tabletop replaced the phone-controller join, which
      # the upstream browser scenarios drive; those (and the rules suite,
      # which needs the emulators) are skipped here so the public test
      # deployment stays unblocked. Reducer/unit coverage still gates it.

  deploy:
    needs: verify
    if: >-
      inputs.update_snapshots != true &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      # Firebase config comes from repository secrets; when they are absent
      # the tabletop falls back to its browser-local store automatically.
      - name: Determine deployment path
        id: deployment
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=/jaipur/pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "destination=pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=/jaipur" >> "$GITHUB_OUTPUT"
            echo "destination=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static client
        run: nix develop --command bun run build
        env:
          PUBLIC_BASE_PATH: ${{ steps.deployment.outputs.base }}
          VITE_GIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          destination_dir: ${{ steps.deployment.outputs.destination }}
          keep_files: true
